
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>
    <link rel="stylesheet" href="/static/expense/expense.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Add Expense</h2>

        <form  action="{% url 'expense:expense_form' %}" method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Category</label>
                <input type="text" name="category" placeholder="e.g. Food, Travel" required>
            </div>

            <div class="form-group">
                <label>Amount</label>
                <input type="number" name="amount" step="0.01" placeholder="Enter amount" required>
            </div>

            <div class="form-group">
                <label>Date</label>
                <input type="date" name="date" required>
            </div>

            <button type="submit">Save Expense</button>
            <h5> Link to Dashboard </h5>
            <button type="submit"><a href = "{% url 'expense:Result' %}">DASHBOARD</a></button>

        </form>
    </div>
</div>

</body>
</html>
